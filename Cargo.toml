[package]
name = "shinybox"
version = "0.1.0"
authors = ["mordisk"]
edition = "2021"

[dependencies]
# core
tokio = { version = "1.32.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }

# storage
sqlx = { version = "0.7.1" , features = ["mysql"] }
toml = "0.8.0"

# actix
actix-web = "4"
actix-files = "0.6.2"
actix-multipart = "0.6.1"

# database


# utils
futures = "0.3.28"
human_bytes = { version = "0.4", features = ["fast"] }
filesize = "0.2.0"
load_file = "1.0.1"
rand = "0.8.5"