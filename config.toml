# this is the configuration file for the server
# you can change the settings here to your liking
[settings]

    # the maximum file size in megabytes
    # default is = 10
    max-file-size = 10

    # the maximum number of files a user can upload
    # default is = 3
    max-file-count = 3

# do not share your tokens with anyone
# they are used to authenticate users
# below are some example tokens to demonstrate
[tokens]
    # this token is used to upload files
    upload-file = ""